name: Update asset versions

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check-asset-versions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/version-assets.js --check

  update-asset-versions:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: update-asset-versions-main
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: node scripts/version-assets.js
      - name: Commit updated asset versions
        id: commit
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Update asset versions" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
