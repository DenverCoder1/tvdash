<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0E0E10">
  <meta name="description" content="TV browser home page with clock, code entry, search and bookmarks.">
  <meta name="color-scheme" content="dark">
  <title>TV Dash</title>
  <link rel="icon" type="image/png" href="assets/tvhome.png">
  <link rel="apple-touch-icon" href="assets/tvhome.png">

  <!-- Open connections early -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://aftv.news">
  <link rel="dns-prefetch" href="https://www.google.com">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/app.js" defer fetchpriority="high"></script>

  <!-- Fonts load without blocking the first paint -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&amp;family=Tajawal:wght@400;700&amp;display=swap"
    media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&amp;family=Tajawal:wght@400;700&amp;display=swap">
  </noscript>


</head>

<body>

  <div class="app" id="app">
    <header>
      <div>
        <div class="time" id="time">--:--</div>
        <div class="date" id="date"></div>
      </div>
      <button type="button" id="editButton">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4" />
        </svg>
        Edit bookmarks
      </button>
    </header>

    <main>
      <form class="search" id="searchForm" role="search" novalidate>
        <div class="field">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM15.5 15.5 20 20" />
          </svg>
          <input id="query" type="text" placeholder="Search Google or type a web address"
            aria-label="Search Google or type a web address" autocomplete="off" autocapitalize="off" spellcheck="false"
            enterkeyhint="go">
        </div>
        <button type="submit" id="searchButton">Search</button>
      </form>

      <form class="code-card" id="codeForm" novalidate>
        <div>
          <h1>Downloader <span>code</span></h1>
          <p class="preview" id="preview">aftv.news/…</p>
        </div>
        <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="12345"
          aria-label="Downloader code" autocomplete="off" enterkeyhint="go" autofocus>
        <button type="submit" class="primary" id="goButton">Go</button>
      </form>

      <section aria-labelledby="bookmarksTitle">
        <h2 id="bookmarksTitle">Bookmarks</h2>
        <div class="tiles" id="tiles"></div>
      </section>
    </main>
  </div>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Edit bookmarks" hidden>
    <div class="dialog">
      <div id="listView">
        <h2 id="listTitle">Edit bookmarks</h2>
        <div class="list" id="list"></div>
        <p class="message" id="listMessage" role="status"></p>
        <div class="actions">
          <button type="button" id="addButton">Add bookmark</button>
          <button type="button" class="primary" id="doneButton">Done</button>
        </div>
      </div>

      <form id="editForm" novalidate hidden>
        <h2 id="editTitle">Add bookmark</h2>
        <label for="bmTitle">Title</label>
        <input id="bmTitle" type="text" maxlength="40" autocomplete="off" enterkeyhint="next">
        <label for="bmUrl">Web address</label>
        <input id="bmUrl" type="text" inputmode="url" placeholder="example.com" autocomplete="off" autocapitalize="off"
          spellcheck="false" enterkeyhint="done">
        <p class="message" id="editMessage" role="alert"></p>
        <div class="actions">
          <button type="button" id="removeButton">Remove</button>
          <button type="button" id="cancelButton">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </form>
    </div>
  </div>

</body>

</html>
