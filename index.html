<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0E0E10">
<meta name="description" content="TV browser home page with clock, code entry, search and bookmarks.">
<meta name="color-scheme" content="dark">
<title>TV Home</title>
<link rel="icon" type="image/png" href="tvhome.png">
<link rel="apple-touch-icon" href="tvhome.png">

<!-- Open connections early -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://aftv.news">
<link rel="dns-prefetch" href="https://www.google.com">

<!-- Fonts load without blocking the first paint -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&amp;family=Tajawal:wght@400;700&amp;display=swap"
      media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&amp;family=Tajawal:wght@400;700&amp;display=swap"></noscript>

<style>
:root {
  /* Color Palette */
  --orange: #F5820A;
  --orange-light: #FF9B30;
  --orange-glow: rgba(245, 130, 10, 0.18);
  --orange-glow-strong: rgba(245, 130, 10, 0.4);
  --dark-bg: #0E0E10;
  --dark-bg-alt: #121215;
  --dark-card: #18181C;
  --dark-card-hover: #1E1E24;
  --dark-border: #2A2A30;
  --gray-mid: #9EA3B0;
  --white: #F5F5F7;
  --black: #000000;

  /* Typography */
  --font-heading: 'Cairo', sans-serif;
  --font-body: 'Tajawal', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
[hidden] { display: none !important; }

/* Everything is sized in rem, so the layout scales with the TV screen */
html {
  font-size: 16px;
  font-size: max(11px, min(1.65vw, 2.9vh));
}

body {
  background: var(--dark-bg);
  color: var(--white);
  font-family: var(--font-body);
  line-height: 1.3;
}

.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto 1fr;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 1.2rem 3rem;
  background: radial-gradient(ellipse 60% 45% at 50% 0%, var(--orange-glow), transparent 70%);
}

header {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: start;
}

.time {
  font-family: var(--font-heading);
  font-size: 3rem;
  font-weight: 800;
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
}

.date { color: var(--gray-mid); font-size: 1.05rem; }

main {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-gap: 1.2rem;
  align-content: center;
  width: 100%;
  max-width: 52rem;
  margin: 0 auto;
  padding-top: .8rem;
}

/* ---------- Controls ---------- */
input, button { font: inherit; color: inherit; }

input {
  width: 100%;
  min-width: 0;
  height: 3.6rem;
  padding: 0 1rem;
  background: var(--dark-bg-alt);
  border: .15rem solid var(--dark-border);
  border-radius: .8rem;
  font-size: 1.25rem;
}

input::placeholder { color: var(--gray-mid); opacity: .6; }

button {
  display: grid;
  grid-auto-flow: column;
  grid-gap: .5rem;
  align-items: center;
  justify-content: center;
  height: 3.6rem;
  padding: 0 1.3rem;
  background: var(--dark-card-hover);
  border: .15rem solid var(--dark-border);
  border-radius: .8rem;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}

button.primary { background: var(--orange); border-color: var(--orange); color: var(--black); }

/* A strong focus ring that is easy to see from the sofa */
input:focus,
button:focus,
.tile:focus {
  outline: .2rem solid var(--white);
  outline-offset: .15rem;
  border-color: var(--orange);
  box-shadow: 0 0 0 .55rem var(--orange-glow-strong);
}

button:hover, .tile:hover { border-color: var(--orange-light); }

.icon {
  width: 1.4rem;
  height: 1.4rem;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- Search ---------- */
.search {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 9rem;
  grid-gap: .9rem;
}

.field { position: relative; }
.field input { padding-left: 3.4rem; }

.field .icon {
  position: absolute;
  left: 1.1rem;
  top: 1.1rem;
  color: var(--gray-mid);
  pointer-events: none;
}

/* ---------- Code entry ---------- */
.code-card {
  display: grid;
  grid-template-columns: 14rem minmax(0, 1fr) 9rem;
  grid-gap: .9rem;
  align-items: center;
  padding: 1.1rem 1.2rem;
  background: var(--dark-card);
  border: 1px solid var(--dark-border);
  border-radius: 1.1rem;
}

.code-card h1 {
  font-family: var(--font-heading);
  font-size: 1.25rem;
  font-weight: 800;
}

.code-card h1 span { color: var(--orange); }
.preview { color: var(--gray-mid); font-size: .95rem; overflow-wrap: anywhere; }

.code-card input {
  height: 4rem;
  font-family: var(--font-heading);
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: .22em;
  text-align: center;
}

.code-card button { height: 4rem; font-size: 1.25rem; }

/* ---------- Bookmarks ---------- */
h2 {
  margin-bottom: .6rem;
  color: var(--gray-mid);
  font-family: var(--font-heading);
  font-size: 1rem;
  font-weight: 700;
}

.tiles {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-gap: .9rem;
}

.tile {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  justify-items: center;
  grid-gap: .25rem;
  height: 5.2rem;
  padding: .5rem;
  background: var(--dark-card);
  border: .15rem solid var(--dark-border);
  border-radius: .8rem;
  color: var(--white);
  text-align: center;
  text-decoration: none;
}

button.tile { grid-auto-flow: row; height: 5.2rem; font-family: var(--font-body); }

.badge {
  display: grid;
  place-items: center;
  width: 2.4rem;
  height: 2.4rem;
  border-radius: .6rem;
  background: var(--orange-glow);
  color: var(--orange-light);
  font-family: var(--font-heading);
  font-size: 1.3rem;
  font-weight: 800;
  line-height: 1;
}

.name {
  max-width: 100%;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: .95rem;
  font-weight: 400;
}

/* ---------- Bookmark editor ---------- */
.overlay {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  display: grid;
  overflow: auto;
  padding: 1rem;
  background: rgba(0, 0, 0, .8);
}

.dialog {
  width: 100%;
  max-width: 46rem;
  margin: auto;
  padding: 1.5rem;
  background: var(--dark-card);
  border: 1px solid var(--dark-border);
  border-radius: 1.1rem;
}

.dialog h2 { margin-bottom: 1rem; color: var(--white); font-size: 1.35rem; }

.list {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-gap: .8rem;
}

.list button {
  grid-auto-flow: row;
  grid-template-columns: minmax(0, 1fr);
  grid-gap: 0;
  justify-items: start;
  align-content: center;
  height: 3.8rem;
  padding: 0 .9rem;
}

.list small {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--gray-mid);
  font-family: var(--font-body);
  font-size: .85rem;
  font-weight: 400;
}

.actions {
  display: grid;
  grid-auto-flow: column;
  grid-gap: .9rem;
  justify-content: end;
  margin-top: 1.4rem;
}

label { display: block; margin: .8rem 0 .4rem; color: var(--gray-mid); }
.message { margin-top: .8rem; color: var(--orange-light); }
.message:empty { margin: 0; }

/* ---------- Narrow or portrait screens ---------- */
@media (max-aspect-ratio: 1/1) {
  html { font-size: max(11px, 3.4vw); }
  .app { padding: 1.2rem 1rem; }
  .search { grid-template-columns: minmax(0, 1fr); }
  .code-card { grid-template-columns: minmax(0, 1fr); }
  .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .list { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>

<div class="app" id="app">
  <header>
    <div>
      <div class="time" id="time">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <button type="button" id="editButton">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/></svg>
      Edit bookmarks
    </button>
  </header>

  <main>
    <form class="search" id="searchForm" role="search" novalidate>
      <div class="field">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM15.5 15.5 20 20"/></svg>
        <input id="query" type="text" placeholder="Search Google or type a web address"
               aria-label="Search Google or type a web address" autocomplete="off"
               autocapitalize="off" spellcheck="false" enterkeyhint="go">
      </div>
      <button type="submit" id="searchButton">Search</button>
    </form>

    <form class="code-card" id="codeForm" novalidate>
      <div>
        <h1>Downloader <span>code</span></h1>
        <p class="preview" id="preview">aftv.news/…</p>
      </div>
      <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="12345"
             aria-label="Downloader code" autocomplete="off" enterkeyhint="go" autofocus>
      <button type="submit" class="primary" id="goButton">Go</button>
    </form>

    <section aria-labelledby="bookmarksTitle">
      <h2 id="bookmarksTitle">Bookmarks</h2>
      <div class="tiles" id="tiles"></div>
    </section>
  </main>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Edit bookmarks" hidden>
  <div class="dialog">
    <div id="listView">
      <h2 id="listTitle">Edit bookmarks</h2>
      <div class="list" id="list"></div>
      <p class="message" id="listMessage" role="status"></p>
      <div class="actions">
        <button type="button" id="addButton">Add bookmark</button>
        <button type="button" class="primary" id="doneButton">Done</button>
      </div>
    </div>

    <form id="editForm" novalidate hidden>
      <h2 id="editTitle">Add bookmark</h2>
      <label for="bmTitle">Title</label>
      <input id="bmTitle" type="text" maxlength="40" autocomplete="off" enterkeyhint="next">
      <label for="bmUrl">Web address</label>
      <input id="bmUrl" type="text" inputmode="url" placeholder="example.com" autocomplete="off"
             autocapitalize="off" spellcheck="false" enterkeyhint="done">
      <p class="message" id="editMessage" role="alert"></p>
      <div class="actions">
        <button type="button" id="removeButton">Remove</button>
        <button type="button" id="cancelButton">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'tvHome.bookmarks';
  var MAX_BOOKMARKS = 12;   // two rows, so the home screen never needs scrolling
  var MAX_DIGITS = 10;
  var DEFAULTS = [
    { title: 'YouTube', url: 'https://www.youtube.com/' },
    { title: 'GitHub', url: 'https://github.com/' },
    { title: 'Speed Test', url: 'https://www.speedtest.net/' },
    { title: 'FMHY', url: 'https://fmhy.net/video#streaming-sites' }
  ];

  function $(id) { return document.getElementById(id); }

  /* ---------- Clock ---------- */
  function tick() {
    var now = new Date();
    var time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    var date = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
    if ($('time').textContent !== time) $('time').textContent = time;
    if ($('date').textContent !== date) $('date').textContent = date;
  }
  tick();
  setInterval(tick, 1000);

  /* ---------- Address detection ---------- */
  var LABEL = '[a-z0-9\\u00a1-\\uffff](?:[a-z0-9_\\-\\u00a1-\\uffff]*[a-z0-9\\u00a1-\\uffff])?';
  var TLD = '(?:xn--[a-z0-9-]+|[a-z\\u00a1-\\uffff]{2,})';
  var REST = '(?::\\d{1,5})?(?:[/?#]\\S*)?$';
  var DOMAIN = new RegExp('^(?:' + LABEL + '\\.)+' + TLD + '\\.?' + REST, 'i');
  var OCTET = '(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)';
  var LOCAL = new RegExp('^(?:localhost|(?:' + OCTET + '\\.){3}' + OCTET + ')' + REST, 'i');

  // Returns a full web address, or null when the text is not one
  function toUrl(text) {
    var value = text.trim();
    var full;
    if (!value || /\s/.test(value)) return null;
    if (/^https?:\/\//i.test(value)) full = value;
    else if (LOCAL.test(value)) full = 'http://' + value;
    else if (DOMAIN.test(value)) full = 'https://' + value;
    else return null;
    try {
      var url = new URL(full);
      return url.hostname ? url.href : null;
    } catch (error) {
      return null;
    }
  }

  /* ---------- Search bar ---------- */
  var query = $('query');

  query.addEventListener('input', function () {
    $('searchButton').textContent = toUrl(query.value) ? 'Open site' : 'Search';
  });

  $('searchForm').addEventListener('submit', function (event) {
    event.preventDefault();
    var text = query.value.trim();
    if (!text) return query.focus();
    window.location.href = toUrl(text) ||
      'https://www.google.com/search?q=' + encodeURIComponent(text);
  });

  /* ---------- Code entry ---------- */
  var code = $('code');

  function updateCode() {
    code.value = code.value.replace(/\D/g, '').slice(0, MAX_DIGITS);
    $('preview').textContent = 'aftv.news/' + (code.value || '…');
  }

  code.addEventListener('input', updateCode);

  $('codeForm').addEventListener('submit', function (event) {
    event.preventDefault();
    updateCode();
    if (!code.value) return code.focus();
    $('goButton').textContent = 'Opening…';
    window.location.href = 'https://aftv.news/' + code.value;
  });

  /* ---------- Bookmark storage ---------- */
  function load() {
    try {
      var saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(saved)) {
        return saved.filter(function (item) {
          return item && typeof item.title === 'string' &&
                 typeof item.url === 'string' && toUrl(item.url);
        }).slice(0, MAX_BOOKMARKS);
      }
    } catch (error) { /* storage blocked or damaged: use the defaults */ }
    return DEFAULTS.slice();
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(bookmarks));
      $('listMessage').textContent = '';
      return true;
    } catch (error) {
      $('listMessage').textContent =
        'This browser blocked saving. Changes will be lost when the page reloads.';
      return false;
    }
  }

  var bookmarks = load();

  /* ---------- Rendering ---------- */
  function make(tag, className, text) {
    var element = document.createElement(tag);
    if (className) element.className = className;
    if (text) element.textContent = text;
    return element;
  }

  function renderHome() {
    var tiles = $('tiles');
    tiles.textContent = '';

    bookmarks.forEach(function (item) {
      var link = make('a', 'tile');
      link.href = toUrl(item.url);
      var badge = make('span', 'badge', Array.from(item.title)[0].toUpperCase());
      badge.setAttribute('aria-hidden', 'true');
      link.appendChild(badge);
      link.appendChild(make('span', 'name', item.title));
      tiles.appendChild(link);
    });

    if (bookmarks.length < MAX_BOOKMARKS) {
      var add = make('button', 'tile');
      add.type = 'button';
      add.appendChild(make('span', 'badge', '+'));
      add.appendChild(make('span', 'name', 'Add'));
      add.addEventListener('click', function () { openEditor(-1, true); });
      tiles.appendChild(add);
    }
  }

  function renderList() {
    var list = $('list');
    list.textContent = '';
    bookmarks.forEach(function (item, index) {
      var button = make('button');
      button.type = 'button';
      button.appendChild(make('span', 'name', item.title));
      button.appendChild(make('small', '', item.url.replace(/^https?:\/\/(www\.)?/, '')));
      button.addEventListener('click', function () { openEditor(index, false); });
      list.appendChild(button);
    });
    $('listTitle').textContent =
      'Edit bookmarks (' + bookmarks.length + ' of ' + MAX_BOOKMARKS + ')';
    $('addButton').hidden = bookmarks.length >= MAX_BOOKMARKS;
  }

  /* ---------- Editor ---------- */
  var overlay = $('overlay');
  var editing = -1;          // index being edited, -1 for a new bookmark
  var fromHome = false;      // opened with the "Add" tile
  var confirmRemove = false;

  function showOverlay() {
    overlay.hidden = false;
    $('app').inert = true;
  }

  function closeOverlay(target) {
    overlay.hidden = true;
    $('app').inert = false;
    renderHome();
    (target ? target() : $('editButton')).focus();
  }

  function showList(focusIndex) {
    showOverlay();
    renderList();
    $('editForm').hidden = true;
    $('listView').hidden = false;
    var items = $('list').children;
    (items[Math.min(focusIndex || 0, items.length - 1)] || $('addButton')).focus();
  }

  function openEditor(index, openedFromHome) {
    editing = index;
    fromHome = openedFromHome;
    confirmRemove = false;
    showOverlay();
    $('listView').hidden = true;
    $('editForm').hidden = false;
    $('editTitle').textContent = index < 0 ? 'Add bookmark' : 'Edit bookmark';
    $('bmTitle').value = index < 0 ? '' : bookmarks[index].title;
    $('bmUrl').value = index < 0 ? '' : bookmarks[index].url;
    $('editMessage').textContent = '';
    $('removeButton').hidden = index < 0;
    $('removeButton').textContent = 'Remove';
    $('bmTitle').focus();
  }

  function leaveEditor() {
    if (fromHome) {
      closeOverlay(function () { return $('tiles').lastElementChild; });
    } else {
      showList(editing < 0 ? bookmarks.length : editing);
    }
  }

  function goBack() {
    if ($('editForm').hidden) closeOverlay();
    else leaveEditor();
  }

  $('editButton').addEventListener('click', function () { showList(0); });
  $('addButton').addEventListener('click', function () { openEditor(-1, false); });
  $('doneButton').addEventListener('click', function () { closeOverlay(); });
  $('cancelButton').addEventListener('click', leaveEditor);

  $('editForm').addEventListener('submit', function (event) {
    event.preventDefault();
    var url = toUrl($('bmUrl').value);
    if (!url) {
      $('editMessage').textContent = 'Enter a web address such as example.com';
      return $('bmUrl').focus();
    }
    var title = $('bmTitle').value.trim() || new URL(url).hostname.replace(/^www\./, '');
    var index = editing < 0 ? bookmarks.length : editing;
    bookmarks[index] = { title: title, url: url };
    var stored = save();

    if (fromHome && stored) {
      closeOverlay(function () { return $('tiles').children[index]; });
    } else {
      showList(index);
    }
  });

  $('removeButton').addEventListener('click', function () {
    // Ask for a second press, so one accidental click removes nothing
    if (!confirmRemove) {
      confirmRemove = true;
      this.textContent = 'Press again to remove';
      return;
    }
    bookmarks.splice(editing, 1);
    save();
    showList(editing);
  });

  /* ---------- Remote control navigation ---------- */
  var ARROWS = { 37: 'left', 38: 'up', 39: 'right', 40: 'down' };
  var BACK_KEYS = [27, 461, 10009];   // Esc, LG webOS Back, Samsung Tizen Back

  function focusable() {
    var scope = overlay.hidden ? $('app') : overlay;
    return Array.prototype.filter.call(
      scope.querySelectorAll('a[href], button, input'),
      function (element) { return element.getClientRects().length > 0; });
  }

  // Left/Right stay on the same row. Up/Down go to the closest row,
  // then to the item in that row that lines up best.
  function findNext(current, direction) {
    var from = current.getBoundingClientRect();
    var vertical = direction === 'up' || direction === 'down';
    var sign = direction === 'down' || direction === 'right' ? 1 : -1;
    var best = null;
    var bestScore = Infinity;

    focusable().forEach(function (element) {
      if (element === current) return;
      var to = element.getBoundingClientRect();
      var distance, score;
      if (vertical) {
        distance = sign > 0 ? to.top - from.bottom : from.top - to.bottom;
        if (distance < -1) return;
        var offset = Math.abs((to.left + to.right) - (from.left + from.right)) / 2;
        score = Math.round(distance / 8) * 100000 + offset;
      } else {
        if (to.bottom <= from.top || to.top >= from.bottom) return;
        distance = sign > 0 ? to.left - from.right : from.left - to.right;
        if (distance < -1) return;
        score = distance;
      }
      if (score < bestScore) { best = element; bestScore = score; }
    });
    return best;
  }

  document.addEventListener('keydown', function (event) {
    if (event.isComposing || event.altKey || event.ctrlKey || event.metaKey) return;
    var active = document.activeElement;
    var typing = active && active.tagName === 'INPUT';
    var direction = ARROWS[event.keyCode];

    if (!overlay.hidden &&
        (BACK_KEYS.indexOf(event.keyCode) > -1 || (event.keyCode === 8 && !typing))) {
      event.preventDefault();
      goBack();
      return;
    }

    // Number keys on the remote jump straight to the code box
    if (overlay.hidden && !typing && /^\d$/.test(event.key)) {
      code.focus();
      return;
    }

    if (!direction) return;

    // Inside a text box, Left/Right move the cursor until it reaches an end
    if (typing && (direction === 'left' || direction === 'right')) {
      var edge = direction === 'left' ? 0 : active.value.length;
      if (active.selectionStart !== edge || active.selectionEnd !== edge) return;
    }

    var items = focusable();
    if (items.indexOf(active) < 0) {
      event.preventDefault();
      if (items.length) (overlay.hidden ? code : items[0]).focus();
      return;
    }

    event.preventDefault();
    var next = findNext(active, direction);
    if (next) {
      next.focus();
      if (next.scrollIntoView) next.scrollIntoView({ block: 'nearest' });
    }
  });

  // Keep focus inside the editor while it is open
  document.addEventListener('focusin', function (event) {
    if (!overlay.hidden && !overlay.contains(event.target)) focusable()[0].focus();
  });

  /* ---------- Start (also runs after the Back button) ---------- */
  window.addEventListener('pageshow', function () {
    $('goButton').textContent = 'Go';
    bookmarks = load();
    updateCode();
    if (overlay.hidden) {
      renderHome();
      code.focus();
    }
  });

  renderHome();
  code.focus();
}());
